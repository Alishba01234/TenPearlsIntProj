name: Hourly Feature Pipeline

# Runs hourly_feature_update.py every hour: fetches only the newest hour(s)
# of data, appends them to the Hopsworks Feature Store, and prunes rows
# older than the 4-year retention window every run -- the dataset here is
# small enough (tens of thousands of rows) that a full read+overwrite each
# hour is cheap, so the window stays exact to the hour rather than
# drifting between prunes.

on:
  schedule:
    - cron: "5 * * * *"   # 5 minutes past every hour (UTC) -- small offset
                            # so it isn't fighting every other repo's
                            # on-the-hour jobs for GitHub's shared runners
  workflow_dispatch: {}    # lets you trigger it manually from the Actions tab

permissions:
  contents: write   # needed to commit the updated aqi_features.csv back

jobs:
  update-features:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run hourly feature update
        env:
          HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
        run: python hourly_feature_update.py --city "Karachi"

      - name: Commit updated aqi_features.csv (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add aqi_features.csv
          git diff --staged --quiet || git commit -m "Hourly feature update [skip ci]"
          git push
