name: Daily Training Pipeline

# Runs once a day: refreshes the training-dataset split so it includes
# everything the hourly job has appended since yesterday, then retrains
# and re-registers models for all 3 horizons (24h/48h/72h), across all 4
# candidate algorithms (ridge, random_forest, xgboost, neural_network).

on:
  schedule:
    - cron: "0 3 * * *"   # 03:00 UTC daily -- after enough hourly runs have
                            # landed for the day, well before Karachi's peak
                            # daytime usage of the dashboard
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  train-models:
    runs-on: ubuntu-latest
    timeout-minutes: 90   # RandomizedSearchCV across 3 horizons x 4 candidates
                            # takes a while -- adjust if your runs are longer
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt tensorflow
          echo "--- Resolved versions (for debugging tensorflow import issues) ---"
          pip show tensorflow numpy protobuf 2>/dev/null | grep -E "^(Name|Version):"
          python -c "import tensorflow as tf; print('tensorflow import OK, version', tf.__version__)" \
            || echo "tensorflow FAILED TO IMPORT right after install -- see error above"

      - name: Refresh training split (pick up new hourly data)
        env:
          HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
        run: python refresh_training_split.py --city Karachi

      - name: Train and register models
        env:
          HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
        run: python train_models.py --city karachi

      - name: Commit evaluation summary + split version (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add model_evaluation_summary.csv latest_td_version.txt
          git diff --staged --quiet || git commit -m "Daily retraining run [skip ci]"
          # This job can run for up to 90 minutes -- long enough for the
          # hourly feature pipeline (or another manual run of this same
          # workflow) to have pushed to main in the meantime, which would
          # make a plain "git push" get rejected as a non-fast-forward.
          # Rebase onto whatever's newest before pushing; safe here since
          # this job only ever touches model_evaluation_summary.csv and
          # latest_td_version.txt, which the hourly job never writes to,
          # so there's nothing for the rebase to actually conflict on.
          git pull --rebase origin main
          git push
