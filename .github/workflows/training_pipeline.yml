name: Daily Training Pipeline

# Runs once a day: refreshes the training-dataset split so it includes
# everything the hourly job has appended since yesterday, then retrains
# and re-registers models for all 3 horizons (24h/48h/72h), across all 4
# candidate algorithms (ridge, random_forest, xgboost, neural_network).

on:
  schedule:
    - cron: "0 3 * * *"   # 03:00 UTC daily -- after enough hourly runs have
                            # landed for the day, well before Karachi's peak
                            # daytime usage of the dashboard
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  train-models:
    runs-on: ubuntu-latest
    timeout-minutes: 90   # RandomizedSearchCV across 3 horizons x 4 candidates
                            # takes a while -- adjust if your runs are longer
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Capture the numpy version requirements.txt actually resolved --
          # this is the version pandas/xgboost/hopsworks were tested
          # against, since it's whatever the repo's own pinned/tested
          # environment produces.
          PINNED_NUMPY=$(python -c "import numpy; print(numpy.__version__)")
          echo "numpy resolved by requirements.txt: $PINNED_NUMPY"
          pip install tensorflow
          # tensorflow's own dependency resolution can silently shift
          # numpy to a version that's binary-incompatible with the
          # already-installed pandas wheel's compiled C extensions
          # (numpy 1.x vs 2.x changed internal struct layouts -- this is
          # what produces "numpy.dtype size changed... Expected 96 from C
          # header, got 88 from PyObject" and crashes EVERY script that
          # imports pandas, not just the neural network candidate). Force
          # numpy back to exactly what requirements.txt resolved. If
          # tensorflow genuinely can't coexist with that numpy version,
          # this reinstall will make tensorflow itself fail to import --
          # which is the right trade-off, since pandas/xgboost/hopsworks
          # are hard requirements for the whole pipeline and tensorflow is
          # an optional candidate that already degrades gracefully (see
          # the try/except around `import tensorflow` in train_models.py).
          pip install "numpy==$PINNED_NUMPY"
          echo "--- Resolved versions (for debugging import issues) ---"
          pip show tensorflow numpy pandas protobuf 2>/dev/null | grep -E "^(Name|Version):"
          python -c "import pandas as pd; print('pandas import OK, version', pd.__version__)"
          python -c "import tensorflow as tf; print('tensorflow import OK, version', tf.__version__)" \
            || echo "tensorflow FAILED TO IMPORT right after install -- see error above"

      - name: Refresh training split (pick up new hourly data)
        env:
          HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
        run: python refresh_training_split.py --city Karachi

      - name: Train and register models
        env:
          HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
        run: python train_models.py --city karachi

      - name: Commit evaluation summary + split version (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add model_evaluation_summary.csv latest_td_version.txt
          git diff --staged --quiet || git commit -m "Daily retraining run [skip ci]"
          # Same reasoning as feature_pipeline.yml: training can leave
          # other tracked files touched as a side effect (e.g. regenerated
          # __pycache__ bytecode from all the imported modules) that we
          # never intended to commit. "git pull --rebase" refuses to run
          # with ANY unstaged tracked-file changes present, so discard
          # anything not deliberately staged and committed above first.
          git checkout -- .
          # This job can run for up to 90 minutes -- long enough for the
          # hourly feature pipeline (or another manual run of this same
          # workflow) to have pushed to main in the meantime, which would
          # make a plain "git push" get rejected as a non-fast-forward.
          # Rebase onto whatever's newest before pushing; safe here since
          # this job only ever touches model_evaluation_summary.csv and
          # latest_td_version.txt, which the hourly job never writes to,
          # so there's nothing for the rebase to actually conflict on.
          git pull --rebase origin main
          git push
